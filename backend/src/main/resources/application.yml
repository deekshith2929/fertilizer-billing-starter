server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  datasource:
   # url: ${DB_URL:jdbc:postgresql://localhost:5432/fertilizer_db}
    url: ${DB_URL:jdbc:postgresql://ep-bitter-fog-a1jdxyp2-pooler.ap-southeast-1.aws.neon.tech:5432/neondb}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    hikari:
      schema: NF
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1500000
      keepalive-time: 300000

  flyway:
    enabled: true
    default-schema: NF
    schemas: NF
    create-schemas: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB